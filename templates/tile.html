<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Квитанция по квартплате — Плитка</title>
    <link rel="stylesheet" href="/static/styles/app.css">
</head>
<body>
<div class="app-frame">
    <main class="tile-page">
        <form class="tariff-form" action="/" method="get">
            <div class="tariff-form-label">
                <span>Тариф до:</span>
                <span class="tariff-value">{{ if and .Tariff (ne .Tariff "101") }}{{ .Tariff }} руб.{{ else }}не ограничен{{ end }}</span>
            </div>
            <!-- 0-100 — точный шаг в 1 руб. для основной массы тарифов,
                 крайнее положение 101 — отдельное значение "без ограничения",
                 чтобы не терять доступ к редким дорогим услугам (например,
                 отопление) при таком узком и точном диапазоне -->
            <input type="range" name="tariff" min="0" max="101" step="1"
                   value="{{ if and .Tariff (ne .Tariff "101") }}{{ .Tariff }}{{ else }}101{{ end }}">
            <button type="submit" class="primary-btn">Применить</button>
        </form>

        <div class="grid">
            {{ range .Utilities }}
            <div class="card-wrap">
                <a class="card" href="/feed/{{ .ID }}">
                    <img src="{{ .DisplayImageURL }}" alt="{{ .Name }}">
                    <div class="info">
                        <p class="name">{{ .Name }}</p>
                        <p class="tariff">{{ .TariffRate }} руб/{{ .MeasurementUnit }}</p>
                        <p class="likes">
                            <span class="like-button">{{ template "heart-icon" }}</span>
                            {{ .LikesCount }}
                        </p>
                    </div>
                </a>
                <form action="/delete-utility" method="post" class="delete-form">
                    <input type="hidden" name="id" value="{{ .ID }}">
                    <button type="submit" title="Удалить услугу">✕</button>
                </form>
            </div>
            {{ end }}
        </div>
    </main>

    {{ template "tabbar" }}
</div>
</body>
</html>
