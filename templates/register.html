<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Квитанция по квартплате — Регистрация</title>
    <link rel="stylesheet" href="/static/styles/app.css">
</head>
<body>
<div class="app-frame">
    <main class="add-page">
        <h1 class="page-title">Регистрация</h1>

        {{ if .Success }}
        <p class="form-success">Пользователь «{{ .Login }}» зарегистрирован.</p>
        {{ else }}
        {{ if .Error }}
        <p class="form-error">{{ .Error }}</p>
        {{ end }}
        <form action="/users/register" method="post">
            <div class="field">
                <span>Логин:</span>
                <input type="text" name="login" value="{{ .Login }}" placeholder="Логин" required>
            </div>

            <div class="field">
                <span>Пароль:</span>
                <input type="password" name="password" placeholder="Пароль" required>
            </div>

            <button type="submit" class="primary-btn">Зарегистрироваться</button>
        </form>
        {{ end }}
    </main>

    {{ template "tabbar" }}
</div>
</body>
</html>
